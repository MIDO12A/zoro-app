name: Build & Publish APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "WARNING: ANDROID_KEYSTORE_BASE64 not set - falling back to debug signing"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/zero-release-key.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=zero
          storeFile=zero-release-key.jks
          EOF

      - name: Read app version
        id: ver
        run: echo "ver=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f1)" >> "$GITHUB_OUTPUT"

      - name: Analyze code (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # Build number uses (large_offset + run_number) to guarantee it is ALWAYS
      # strictly increasing and higher than any previously installed APK.
      # 2000009100 leaves a safe gap over any previous number (user requested > 2000007181).
      - name: Build release APKs
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((2000009100 + BUILD_NUM))
          flutter build apk --release --split-per-abi --build-number=$VERSION_CODE 2>&1 | tee build_log.txt || {
            echo "::error::Flutter build failed. Showing last 200 lines of build log:"
            tail -n 200 build_log.txt
            exit 1
          }
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Prepare Release Assets
        env:
          APP_VER: ${{ steps.ver.outputs.ver }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p release_assets
          # Copy non-empty generated APKs only (size > 100KB)
          find build/app/outputs/flutter-apk -type f -name "*.apk" -size +100k -exec cp -v {} release_assets/ \;
          # Ensure build_info.json is also created
          printf '{"version":"%s","build_number":%s,"commit":"%s"}\n' "$APP_VER" "$VERSION_CODE" "$SHA" > release_assets/build_info.json
          ls -lh release_assets/

      - name: Upload APKs to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zero-app-v${{ steps.ver.outputs.ver }}-${{ env.VERSION_CODE }}
          path: release_assets/*
          retention-days: 30

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.ver }}+${{ env.VERSION_CODE }}
          name: Release v${{ steps.ver.outputs.ver }} (${{ env.VERSION_CODE }})
          body: Auto-build of commit ${{ github.sha }} with version code ${{ env.VERSION_CODE }}.
          files: release_assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
