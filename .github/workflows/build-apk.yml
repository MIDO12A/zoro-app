name: Build & Publish APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "WARNING: ANDROID_KEYSTORE_BASE64 not set - falling back to debug signing"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/zero-release-key.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=zero
          storeFile=zero-release-key.jks
          EOF

      - name: Read app version
        id: ver
        run: echo "ver=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f1)" >> "$GITHUB_OUTPUT"

      - name: Analyze code (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # Build number uses (large_offset + run_number) to guarantee it is ALWAYS
      # strictly increasing and higher than any previously installed APK.
      # 1789000000 is above all existing UNIX timestamps and old numbers in this project.
      - name: Build release APKs
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((2000003800 + BUILD_NUM))
          flutter build apk --release --split-per-abi --build-number=$VERSION_CODE 2>&1 | tee build_log.txt || {
            echo "::error::Flutter build failed. Showing last 200 lines of build log:"
            tail -n 200 build_log.txt
            exit 1
          }
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Rename APKs
        run: |
          python3 -c "
          import os, shutil, glob
          apks = glob.glob('**/*.apk', recursive=True)
          print('Found APKs:', apks)
          arm64 = [f for f in apks if 'arm64' in f]
          arm32 = [f for f in apks if 'armeabi' in f or 'arm32' in f or 'v7a' in f]
          x86 = [f for f in apks if 'x86_64' in f]
          universal = [f for f in apks if 'release' in f]
          
          target_arm64 = arm64[0] if arm64 else (universal[0] if universal else (apks[0] if apks else None))
          target_arm32 = arm32[0] if arm32 else target_arm64
          target_x86 = x86[0] if x86 else target_arm64
          
          if target_arm64: shutil.copyfile(target_arm64, 'zero-app.apk')
          if target_arm32: shutil.copyfile(target_arm32, 'zero-app-arm32.apk')
          if target_x86: shutil.copyfile(target_x86, 'zero-app-x86_64.apk')
          "
          ls -la zero-app*.apk

      - name: Create build info
        env:
          APP_VER: ${{ steps.ver.outputs.ver }}
          SHA: ${{ github.sha }}
        run: |
          printf '{"version":"%s","build_number":%s,"commit":"%s"}\n' "$APP_VER" "$VERSION_CODE" "$SHA" > build_info.json
          cat build_info.json

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            "zero-app.apk#zero-app.apk (arm64)" \
            "zero-app-arm32.apk#zero-app-arm32.apk (arm32)" \
            "zero-app-x86_64.apk#zero-app-x86_64.apk (x86_64)" \
            "build_info.json#build_info.json" \
            --title "Update v${{ github.run_number }}" \
            --notes "Auto-build of commit ${{ github.sha }}" \
            --latest
