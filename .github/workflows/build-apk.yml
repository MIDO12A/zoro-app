name: Build & Publish APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Read app version
        id: ver
        run: echo "ver=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f1)" >> "$GITHUB_OUTPUT"

      # Build number = run number + 1000 so it is always higher than any
      # locally-built APK; each push therefore produces a strictly newer build.
      - name: Build release APK
        run: flutter build apk --release --build-number=$((1000 + ${{ github.run_number }}))

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk zero-app.apk

      - name: Create build info
        run: |
          echo '{"version":"${{ steps.ver.outputs.ver }}","build_number":$((1000 + ${{ github.run_number }})),"commit":"${{ github.sha }}"}' > build_info.json

      - name: Publish to GitHub Release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest zero-app.apk#zero-app.apk build_info.json#build_info.json \
            --title "Zero App v${{ steps.ver.outputs.ver }} (build $((1000 + ${{ github.run_number }})))" \
            --notes "Auto-build of commit ${{ github.sha }}" \
            --latest
