# fly.toml file for Zero Backend deployment on Fly.io

app = "zero-backend"
primary_region = "cdg"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  JWT_EXPIRES_IN = "7d"
  ADMIN_EMAIL = "admin@zero.app"
