<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
            overflow: auto;
        }
        .container {
            width: 100%;
        }
        img {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
<div class="container">
    <img id="img" >
</div>
<script>
    function insertImg(path){
        var img=document.getElementById("img");
        img.src=path;
        }
</script>
</body>
</html>
